name: Sync with Movix

# Movix adds domains and reships its stylesheet without notice. This job regenerates the
# domain list and the theme adapter, and opens a pull request when either one changed.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:domains
      - run: pnpm sync:upstream
      - run: pnpm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/movix-upstream
          commit-message: Sync domains and theme adapter with Movix
          title: Sync domains and theme adapter with Movix
          body: |
            Regenerated by `pnpm sync:domains` and `pnpm sync:upstream`.

            Review the diff of `src/shared/domains.json` (a new domain changes the extension's permissions)
            and run `pnpm build && pnpm preview:live` to check the themes against the real site before merging.
